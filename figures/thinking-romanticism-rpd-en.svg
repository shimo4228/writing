<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C65F38"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#C65F38">Is Not Thinking the Endpoint of Mastery in Meditation?</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">One option, tried out in the head</text>
<rect x="100" y="235" width="780" height="110" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="490" y="305" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">Recognize "the usual kind"</text>
<line x1="490" y1="348" x2="490" y2="402" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<rect x="100" y="410" width="780" height="110" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="490" y="480" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">Come up with one option</text>
<line x1="490" y1="523" x2="490" y2="577" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<rect x="100" y="585" width="780" height="110" rx="16" fill="#FAFAF7" stroke="#C65F38" stroke-width="7"/>
<text x="490" y="655" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">Trace in your head how it plays out</text>
<line x1="400" y1="698" x2="210" y2="782" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<line x1="490" y1="698" x2="490" y2="782" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<line x1="580" y1="698" x2="780" y2="782" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<rect x="60" y="790" width="270" height="160" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="195" y="852" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">Likely to work</text>
<text x="195" y="915" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">Do it</text>
<rect x="355" y="790" width="270" height="160" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="490" y="852" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">Likely short</text>
<text x="490" y="915" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">Adjust</text>
<rect x="650" y="790" width="270" height="160" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="785" y="852" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">Likely to fail</text>
<text x="785" y="915" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">Next option</text>
<line x1="930" y1="240" x2="930" y2="515" stroke="#242321" stroke-width="5"/>
<text x="950" y="395" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#242321">Intuition</text>
<line x1="930" y1="590" x2="930" y2="690" stroke="#C65F38" stroke-width="7"/>
<text x="950" y="622" font-family="Noto Sans CJK JP" font-weight="bold" font-size="36" fill="#C65F38">Conscious</text>
<text x="950" y="676" font-family="Noto Sans CJK JP" font-weight="bold" font-size="42" fill="#C65F38">analysis</text>
<text x="600" y="1080" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="bold" font-size="46" fill="#242321">Not comparing, but still thinking</text>
</svg>

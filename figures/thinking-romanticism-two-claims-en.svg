<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#242321"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C65F38"/></marker>
</defs>
<rect width="1200" height="1200" fill="#FAFAF7"/>
<text x="60" y="95" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#C65F38">Is Not Thinking the Endpoint of Mastery in Meditation?</text>
<text x="60" y="178" font-family="Noto Serif CJK JP" font-weight="bold" font-size="60" fill="#242321">Two claims I read as mixed</text>
<rect x="300" y="235" width="600" height="120" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="600" y="312" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">"Not thinking is good"</text>
<line x1="470" y1="358" x2="320" y2="490" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<line x1="730" y1="358" x2="880" y2="490" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<rect x="60" y="500" width="480" height="200" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="300" y="585" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">Not thinking works</text>
<text x="300" y="647" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="46" fill="#242321">better in some cases</text>
<text x="300" y="755" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">About attention</text>
<rect x="660" y="500" width="480" height="200" rx="16" fill="#FAFAF7" stroke="#C65F38" stroke-width="7"/>
<text x="900" y="585" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">Not thinking as</text>
<text x="900" y="647" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="40" fill="#242321">the valuable endpoint</text>
<text x="1140" y="755" text-anchor="end" font-family="Noto Sans CJK JP" font-weight="bold" font-size="36" fill="#C65F38">The "proof of mastery" story</text>
<rect x="120" y="890" width="360" height="120" rx="16" fill="#FAFAF7" stroke="#242321" stroke-width="5"/>
<text x="300" y="965" text-anchor="middle" font-family="Noto Sans CJK JP" font-weight="500" font-size="42" fill="#242321">The pianist</text>
<line x1="300" y1="885" x2="300" y2="785" stroke="#242321" stroke-width="5" marker-end="url(#ai)"/>
<text x="325" y="848" font-family="Noto Sans CJK JP" font-weight="500" font-size="36" fill="#242321">Supported</text>
<line x1="490" y1="940" x2="720" y2="820" stroke="#C65F38" stroke-width="7" stroke-dasharray="20 14"/>
<text x="700" y="930" font-family="Noto Sans CJK JP" font-weight="bold" font-size="40" fill="#C65F38">Support doesn't reach</text>
</svg>
